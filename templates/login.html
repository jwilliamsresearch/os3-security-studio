{% extends "base.html" %}

{% block title %}Login - OS{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">
                <h4><i class="fas fa-sign-in-alt"></i> Login</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Login</button>
                </form>
                
                <hr>
                <div class="alert alert-info">
                    <h6>Default Test Accounts:</h6>
                    <p class="mb-1"><strong>Admin:</strong> admin / admin123</p>
                    <p class="mb-0"><strong>User:</strong> testuser / password</p>
                </div>
                
                <div class="text-center mt-3">
                    <p>Want to test registration? Try:</p>
                    <a href="{{ url_for('auth.insecure_register') }}" class="btn btn-outline-danger btn-sm">Insecure Register</a>
                    <a href="{{ url_for('auth.secure_register') }}" class="btn btn-outline-success btn-sm">Secure Register</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
